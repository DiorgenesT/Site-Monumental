name: Diagnóstico FTP (temporário)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Instala lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Recria public_html e move os arquivos pra dentro dela
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" -e "
          set ssl:verify-certificate no;
          set ftp:ssl-force false;
          set ftp:ssl-allow false;
          mkdir -p public_html;
          mv index.html public_html/;
          mv contato.html public_html/;
          mv planos.html public_html/;
          mv politica-de-privacidade.html public_html/;
          mv regulamento.html public_html/;
          mv robots.txt public_html/;
          mv seja-prestador.html public_html/;
          mv servicos.html public_html/;
          mv sitemap.xml public_html/;
          mv sobre-nos.html public_html/;
          mv trabalhe-conosco.html public_html/;
          mv api public_html/;
          mv assets public_html/;
          mv img public_html/;
          mv .ftp-deploy-sync-state.json public_html/;
          echo '=== conferindo public_html/ ===';
          cd public_html && ls -a;
          bye
          "
