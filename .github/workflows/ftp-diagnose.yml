name: Diagnóstico FTP (temporário)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Instala lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Lista a raiz do login FTP
        run: |
          echo "=== Conteúdo da raiz (.) do login FTP ==="
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" -e "ls -a; pwd; bye" || true

      - name: Tenta listar ./public_html/ a partir da raiz
        run: |
          echo "=== Conteúdo de ./public_html/ (se existir) ==="
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" -e "cd public_html && ls -a && pwd; bye" || true
