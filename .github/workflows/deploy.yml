name: Deploy para HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Roda os testes
        run: npm test

      - name: Build de produção
        run: npm run build

      # SMTP_USER/SMTP_PASS são de uma caixa dedicada só ao envio automático
      # (ex: naoresponda@monumentalassistencia.com.br) — nunca a caixa de uso
      # diário da empresa. O destino (to_email) é fixo e não depende de Secret.
      - name: Gera public/api/config.php a partir dos Secrets
        run: |
          cat > dist/api/config.php << EOF
          <?php
          return [
              'smtp_host' => '${{ secrets.SMTP_HOST }}',
              'smtp_port' => ${{ secrets.SMTP_PORT }},
              'smtp_secure' => '${{ secrets.SMTP_SECURE }}',
              'smtp_user' => '${{ secrets.SMTP_USER }}',
              'smtp_pass' => '${{ secrets.SMTP_PASS }}',
              'to_email' => 'direcao@monumentalassistencia.com.br',
              'to_name' => 'Monumental Assistência',
          ];
          EOF

      - name: Publica em produção via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # A conta FTP dedicada já tem home = public_html (confirmado via
          # diagnóstico), então o destino é a raiz do login, não ./public_html/.
          server-dir: ./
          dangerous-clean-slate: true
          exclude: |
            **/.well-known/**
            **/api/tests/**
